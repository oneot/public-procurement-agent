# ──────────────────────────────────────────────────────────────────────
#  public-procurement-agent 기본 설정
#
#  사용자 설정 파일(--config)은 이 파일 위에 "섹션 단위"로 병합됩니다.
#  섹션 안에서 지정한 키는 값 전체가 교체됩니다(목록/표 포함).
#  예) [filters] 의 topics 를 지정하면 기본 주제 5개 대신 지정한 주제만 사용합니다.
# ──────────────────────────────────────────────────────────────────────

[api]
# 조달청_나라장터 입찰공고정보서비스 (공공데이터포털 data.go.kr)
base_url = "https://apis.data.go.kr/1230000/ad/BidPublicInfoService"
page_size = 100
timeout_seconds = 60
# 일시적 오류(네트워크·타임아웃·429·5xx)에 대한 재시도 횟수와 지수 백오프 기본 대기(초)
max_retries = 3
backoff_seconds = 2.0

# 수집 대상 업무 구분 (오퍼레이션명 = 한글 라벨)
[api.operations]
getBidPblancListInfoThng = "물품"
getBidPblancListInfoServc = "용역"
getBidPblancListInfoCnstwk = "공사"
getBidPblancListInfoFrgcpt = "외자"

[collect]
# 오늘(KST) 기준 최근 N일 (어제까지). 기본 7 = 지난 1주일
days = 7
# 최소 예산(원). 0 = 금액 제한 없음 (주제 필터로 이미 좁혀지므로)
min_budget = 0
# 이 금액 이상이면 ★대형으로 강조 (기본 10억)
large_budget_mark = 1_000_000_000
# 리포트 출력 디렉터리 (현재 작업 디렉터리 기준)
output_dir = "output"

[filters]
# (1) 고객 = 초·중·고 + 시도교육청 (K-12만, 대학 제외)
# 공고/수요기관명에 아래 키워드가 있으면 'K-12 교육기관'으로 인정
edu_keywords = [
    "교육청", "교육지원청",
    "초등학교", "중학교", "고등학교", "유치원", "특수학교",
    "과학고", "외국어고", "예술고", "체육고", "마이스터고",
    "특성화고", "국제고", "자율고",
]
# 단, 아래가 포함되면 제외 (대학·전문대·폴리텍/병원 등 비-K12 기관)
edu_exclude = ["대학", "병원", "의료원", "치과병원", "한방병원", "요양원", "보건소"]
# 학교 '이름' 자체에 주제어가 들어가 생기는 오탐 제거용 (예: 부산소프트웨어마이스터고)
school_name_noise = [
    "소프트웨어마이스터고", "소프트웨어고등학교", "소프트웨어고",
    "소프트웨어과학고", "인공지능고등학교", "디지털미디어고",
]
# 이메일·로그에 표시되는 필터 설명
audience_label = "시·도교육청·교육지원청·초중고"
topic_label = "AI/소프트웨어/클라우드/보안/PC"

# (2) 초점 주제 = AI / 소프트웨어 / 클라우드 / 보안 / PC
# 키워드가 영문 대문자로 시작하면 대소문자 구분 매칭 (AI, SW 등 짧은 영문 오탐 방지)
[filters.topics]
AI = [
    "AI", "인공지능", "생성형", "머신러닝", "딥러닝", "LLM", "챗봇",
    "지능형", "지능정보", "초거대", "피지컬AI", "Physical-AI", "AIDX",
]
SW = [
    "소프트웨어", "SW", "라이선스", "라이센스", "구독", "솔루션",
    "정보시스템", "시스템 구축", "시스템 고도화", "고도화 구축", "플랫폼",
    "응용프로그램", "학습관리", "LMS", "원격수업", "에듀테크", "소프트웨어개발",
]
"클라우드" = ["클라우드", "Cloud", "가상화", "VDI", "SaaS", "데이터센터 구축"]
"보안" = [
    "보안", "정보보호", "정보보안", "개인정보", "침해", "관제", "방화벽",
    "백신", "암호화", "취약점", "사이버", "EDR", "SIEM", "제로트러스트",
]
# 하드웨어 중 PC(단말)만 포함 — 노트북·태블릿·크롬북 등 학생/교원용 컴퓨팅 기기
PC = ["PC", "노트북", "데스크톱", "데스크탑", "크롬북", "태블릿", "컴퓨터", "올인원"]

[email]
# KPI "○○ 관련" 카드에 집계할 주제
highlight_topic = "AI"
# KPI "마감 임박(N일)" 기준 일수
urgent_days = 3

# 이메일 브랜딩 — 모든 값은 BRIEF_* 환경변수로 덮어쓸 수 있습니다 (README 참고).
# 텍스트에는 {year}, {date}(YYYY-MM-DD), {brand_name} 자리표시자를 쓸 수 있습니다.
[branding]
# 헤더/푸터 로고 옆에 표시할 이름 (빈 값이면 로고 영역 생략)
brand_name = ""
# 로고 이미지 URL (https 만 허용, 선택)
logo_url = ""
# 이미지 없이 표로 그리는 2×2 컬러 마크 (#RRGGBB 4개: 좌상·우상·좌하·우하, 선택)
logo_mark_colors = []
eyebrow = "Weekly Korea K-12 Market Procurement Brief"
title = "🇰🇷 K-12 Public Procurement Agent"
section_label = "✨ 이번주 주목할 주요 사업 기회 · 마감 임박순"
# 푸터 하단 문구 (빈 값이면 생략). 예: "© {year} {brand_name}. All rights reserved."
footer_text = ""
email_subject = "WEEKLY KOREA K-12 MARKET PROCUREMENT BRIEF | {date}"
