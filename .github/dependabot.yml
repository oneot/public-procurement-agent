version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    groups:
      github-actions:
        patterns: ["*"]
